[workspace]
resolver = "3"
members = ["kernel", "crates/objects", "crates/xdbc", "crates/sys", "crates/toolkit", "crates/console", "crates/inet", "crates/wifi", "user/pingpong", "user/shell", "user/cm", "user/echo", "user/counter", "user/testclient", "user/pcibus", "user/virtio-blk", "user/virtio-gpu", "user/nvme", "user/ahci", "user/virtio-net", "user/net", "user/dns", "user/xhci", "user/hid", "user/memserver", "user/fs", "crates/driver", "crates/idl", "crates/lde", "user/lde-8139cp", "user/lde-e100", "user/lde-bochs", "user/lde-es1370", "user/compositor", "user/greeter", "user/list", "user/notes", "user/panel", "user/mixer", "user/updater", "user/linux", "user/linux-fptest", "user/linux-smptest", "loader", "xtask"]
# The kernel only builds for x86_64-unknown-none, so plain `cargo build` / `cargo test`
# on the host covers the host-testable crates. Use `cargo xtask` for the kernel.
default-members = ["crates/objects", "crates/xdbc", "xtask"]

[workspace.package]
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TemiKayode/superior"

[profile.release]
debug = true
