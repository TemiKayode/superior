[workspace]
resolver = "3"
members = ["kernel", "crates/objects", "user/pingpong", "user/shell", "xtask"]
# The kernel only builds for x86_64-unknown-none, so plain `cargo build` / `cargo test`
# on the host covers the host-testable crates. Use `cargo xtask` for the kernel.
default-members = ["crates/objects", "xtask"]

[workspace.package]
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TemiKayode/superior"

[profile.release]
debug = true
