[package]
name = "superior-shell"
description = "The Superior boot shell, which is also its own serial driver."
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"
publish = false

[[bin]]
name = "superior-shell"
test = false
bench = false

[dependencies]
superior-objects = { path = "../../crates/objects" }
superior-sys = { path = "../../crates/sys" }
superior-toolkit = { path = "../../crates/toolkit" }

[features]
# Build as seL4's root task instead of a Superior program.
sel4 = ["superior-sys/sel4"]
