[package]
name = "xtask"
description = "Build, image and run Superior: `cargo xtask run | test | image`."
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"
publish = false

[dependencies]
bootloader = "0.11"
superior-idl = { path = "../crates/idl" }
# Signs boot bundles (verified boot), with a key from the OS random source.
ed25519-dalek = "2"
getrandom = "0.2"
superior-objects = { path = "../crates/objects" }
# Draws the toolkit test's app as it must look, to check screenshots.
superior-toolkit = { path = "../crates/toolkit" }
# Draws the screen console as the shell must, to check screenshots.
superior-console = { path = "../crates/console" }
# Plays the access point at the far end of the Wi-Fi test's simulated radio.
superior-wifi = { path = "../crates/wifi" }
# The AArch64 UEFI disk: a GPT disk whose EFI system partition holds the
# loader (the same versions the bootloader crate uses for x86-64's).
fatfs = { version = "0.3.4", default-features = false, features = ["std", "alloc"] }
gpt = "3.0.0"
