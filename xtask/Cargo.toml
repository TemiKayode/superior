[package]
name = "xtask"
description = "Build, image and run Superior: `cargo xtask run | test | image`."
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"
publish = false

[dependencies]
bootloader = "0.11"
superior-idl = { path = "../crates/idl" }
# Signs boot bundles (verified boot), with a key from the OS random source.
ed25519-dalek = "2"
getrandom = "0.2"
superior-objects = { path = "../crates/objects" }
# Draws the toolkit test's app as it must look, to check screenshots.
superior-toolkit = { path = "../crates/toolkit" }
