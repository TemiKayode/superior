[package]
name = "superior-objects"
description = "Kernel object model for Superior: capabilities, CNodes and untyped memory. no_std, host-testable."
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"

[dependencies]

[dev-dependencies]
# Signs test messages for the Ed25519 verifier to check (host tests only).
ed25519-dalek = "2"
# A TLS 1.3 server (and its certificate) for the TLS client to talk to
# (host tests only).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
