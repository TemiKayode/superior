[package]
name = "superior-kernel"
description = "The Superior microkernel."
version.workspace = true
license.workspace = true
repository.workspace = true
# Edition 2021 until bootloader_api's entry_point! macro is verified under
# edition 2024 (its generated attributes may need `unsafe(...)`).
edition = "2021"

[[bin]]
name = "superior-kernel"
test = false
bench = false

[features]
# Run the boot self-tests, then exit QEMU with a pass/fail code.
selftest = []

[dependencies]
superior-objects = { path = "../crates/objects" }
bootloader_api = "0.11"
x86_64 = "0.15"
uart_16550 = "0.3"
spin = { version = "0.9", default-features = false, features = ["spin_mutex", "lazy"] }
